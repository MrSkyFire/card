name: Build DBSC Windows x64
on:
  push:
    branches: [ dbsc-windows-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            make
            curl
            tar

      - name: Fetch upstream DBSC
        shell: msys2 {0}
        run: |
          rm -rf /tmp/dbsc-upstream
          mkdir -p /tmp/dbsc-upstream
          curl -L --fail https://github.com/DikuMUDOmnibus/DragonBall-Saga/archive/refs/heads/master.tar.gz | tar -xz --strip-components=1 -C /tmp/dbsc-upstream
          rm -rf dbsc-windows/game
          mkdir -p dbsc-windows/game
          cp -a /tmp/dbsc-upstream/. dbsc-windows/game/

      - name: Apply Windows compatibility patches
        shell: msys2 {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("dbsc-windows/game/src")

          p=root/"comm.c"
          s=p.read_text(errors="ignore")
          s=s.replace("#include <sys/wait.h>","")
          s=s.replace("#include <crypt.h>","")
          p.write_text(s)

          p=root/"mud.h"
          s=p.read_text(errors="ignore")
          s=s.replace('#include <dlfcn.h> /*this might not be necessary for your UNIX machine.*/',
                      '#ifndef WIN32\n#include <dlfcn.h>\n#endif')
          p.write_text(s)

          # Modern MinGW provides dirent; DBSC's ancient MSVC shim conflicts with it.
          p=root/"mud.h"
          s=p.read_text(errors="ignore")
          old='''#ifdef WIN32
void gettimeofday(struct timeval *tv, struct timezone *tz);
void kill_timer();

/* directory scanning stuff */

typedef struct dirent
{
    char *\td_name;
};

typedef struct
{
    HANDLE\t\thDirectory;
    WIN32_FIND_DATA\tWin32FindData;
    struct dirent\tdirinfo;
    char\t\tsDirName[MAX_PATH];
} DIR;


DIR *opendir(char * sDirName);
struct dirent *readdir (DIR * dp);
void closedir(DIR * dp);

/* --------------- Stuff for Win32 services ------------------ */'''
          new='''#ifdef WIN32
#ifndef __MINGW32__
void gettimeofday(struct timeval *tv, struct timezone *tz);

/* directory scanning stuff */
typedef struct dirent { char * d_name; };
typedef struct {
    HANDLE hDirectory;
    WIN32_FIND_DATA Win32FindData;
    struct dirent dirinfo;
    char sDirName[MAX_PATH];
} DIR;
DIR *opendir(char * sDirName);
struct dirent *readdir (DIR * dp);
void closedir(DIR * dp);
#else
#include <dirent.h>
#endif
void kill_timer();

/* --------------- Stuff for Win32 services ------------------ */'''
          s=s.replace(old,new)
          s=s.replace('#define QUICKMATCH(p1, p2)      (int) (p1) == (int) (p2)',
                      '#define QUICKMATCH(p1, p2)      ((p1) == (p2))')
          p.write_text(s)

          p=root/"misc.c"
          s=p.read_text(errors="ignore")
          s=s.replace('#ifdef WIN32\n\n/* routines not in Windows runtime libraries */',
                      '#if defined(WIN32) && !defined(__MINGW32__)\n\n/* routines not in Windows runtime libraries */')
          p.write_text(s)

          # Fix old source declarations that modern GCC correctly rejects.
          p=root/"services.c"
          s=p.read_text(errors="ignore")
          s=s.replace('VOID    service_main(DWORD dwArgc, LPTSTR *lpszArgv);','static VOID service_main(DWORD dwArgc, LPTSTR *lpszArgv);')
          s=s.replace('VOID    WINAPI service_ctrl(DWORD dwCtrlCode);','static VOID WINAPI service_ctrl(DWORD dwCtrlCode);')
          s=s.replace('BOOL    ReportStatusToSCMgr(DWORD dwCurrentState,','static BOOL ReportStatusToSCMgr(DWORD dwCurrentState,')
          s=s.replace('VOID    worker_thread(VOID *notused);','static VOID worker_thread(VOID *notused);')
          s=s.replace('VOID    StopService(LPTSTR lpszMsg);','static VOID StopService(LPTSTR lpszMsg);')
          p.write_text(s)

          # sha256.c assumes BSD/Linux endian.h. Windows x64 is little-endian.
          p=root/"sha256.c"
          s=p.read_text(errors="ignore")
          old='''#if defined(__FreeBSD__)
#include <sys/endian.h>
#else
#include <endian.h>
#endif'''
          new='''#ifdef WIN32
#ifndef LITTLE_ENDIAN
#define LITTLE_ENDIAN 1234
#endif
#ifndef BIG_ENDIAN
#define BIG_ENDIAN 4321
#endif
#ifndef BYTE_ORDER
#define BYTE_ORDER LITTLE_ENDIAN
#endif
#else
#if defined(__FreeBSD__)
#include <sys/endian.h>
#else
#include <endian.h>
#endif
#endif'''
          s=s.replace(old,new)
          p.write_text(s)

                    p=root/"hotboot.c"
          s=p.read_text(errors="ignore")
          s=s.replace("#include <unistd.h>","#ifndef WIN32\n#include <unistd.h>\n#endif")
          s=s.replace("#include <sys/wait.h>","#ifndef WIN32\n#include <sys/wait.h>\n#endif")
          s=s.replace('execl( EXE_FILE, "dbsaga", buf, "hotboot", buf2, buf3, (char *)NULL );',
                      '/* Windows standalone build: hotboot exec disabled; use launcher restart. */')
          p.write_text(s)

          # DNS slave code requires fork/pipe/waitpid; local build runs with name resolving disabled.
          (root/"dns_win_stub.c").write_text(r'''
          #include "mud.h"
          DNS_DATA *first_cache = NULL;
          DNS_DATA *last_cache = NULL;
          void save_dns(void) {}
          void prune_dns(void) {}
          void check_dns(void) {}
          void load_dns(void) {}
          char *in_dns_cache(char *ip) { static char blank[1] = {0}; return blank; }
          void process_dns(DESCRIPTOR_DATA *d) { (void)d; }
          void resolve_dns(DESCRIPTOR_DATA *d, long ip) { (void)d; (void)ip; }
          void do_cache(CHAR_DATA *ch, char *argument) { (void)argument; send_to_char("DNS cache disabled in Windows local build.\n\r", ch); }
          ''')

          # MinGW compatibility aliases.
          p=root/"mud.h"; s=p.read_text(errors="ignore")
          marker="#ifdef WIN32"
          add=r'''
          #ifdef WIN32
          #include <windows.h>
          #include <direct.h>
          #include <process.h>
          #ifndef unlink
          #define unlink _unlink
          #endif
          #ifndef sleep
          #define sleep(x) Sleep((x)*1000)
          #endif
          #endif
          '''
          s=s.replace(marker,add+"\n"+marker,1)
          p.write_text(s)
          PY

      - name: Compile native DBSC server
        shell: msys2 {0}
        run: |
          cd dbsc-windows/game/src
          SRC=$(ls *.c | grep -v -E '^(dns|resolver|imc)\.c$')
          gcc -std=gnu99 -O2 -fcommon -DWIN32 -D_WIN32_WINNT=0x0601 \
            -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types \
            -I. -Ichat $SRC dns_win_stub.c \
            -o ../../dbsaga-server.exe \
            -lws2_32 -lwinmm -ladvapi32 -luser32 -lshell32

      - name: Compile integrated launcher
        shell: msys2 {0}
        run: |
          cd dbsc-windows
          g++ -std=c++17 -O2 -municode launcher.cpp -o DBSC.exe -mwindows -lws2_32

      - name: Assemble portable package
        shell: msys2 {0}
        run: |
          mkdir -p dist/DBSC
          cp DBSC.exe dbsaga-server.exe README.txt dist/DBSC/
          for d in area boards clans classes corpses deities gods hotboot houses log planets player races space system; do
            if [ -d game/$d ]; then cp -a game/$d dist/DBSC/; fi
          done
          cp -a game/*.README game/*LICENSE* game/COPYRIGHT* dist/DBSC/ 2>/dev/null || true

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DBSC-Windows-x64
          path: dbsc-windows/dist/DBSC
