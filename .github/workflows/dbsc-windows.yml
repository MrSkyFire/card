name: Build DBSC Windows x64
on:
  push:
    branches: [ dbsc-windows-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            make
            curl
            tar

      - name: Fetch upstream DBSC
        shell: msys2 {0}
        run: |
          rm -rf /tmp/dbsc-upstream
          mkdir -p /tmp/dbsc-upstream
          curl -L --fail https://github.com/DikuMUDOmnibus/DragonBall-Saga/archive/refs/heads/master.tar.gz | tar -xz --strip-components=1 -C /tmp/dbsc-upstream
          rm -rf dbsc-windows/game
          mkdir -p dbsc-windows/game
          cp -a /tmp/dbsc-upstream/. dbsc-windows/game/

      - name: Apply Windows compatibility patches
        shell: msys2 {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path("dbsc-windows/game/src")

          p=root/"comm.c"
          t=p.read_text(errors="ignore")
          t=t.replace("#include <sys/wait.h>","").replace("#include <crypt.h>","")
          p.write_text(t)

          p=root/"mud.h"
          t=p.read_text(errors="ignore")
          t=t.replace('#include <dlfcn.h> /*this might not be necessary for your UNIX machine.*/','#ifndef WIN32\\n#include <dlfcn.h>\\n#endif')
          t=t.replace('#define QUICKMATCH(p1, p2)      (int) (p1) == (int) (p2)','#define QUICKMATCH(p1, p2)      ((p1) == (p2))')
          marker='void gettimeofday(struct timeval *tv, struct timezone *tz);\\nvoid kill_timer();\\n\\n/* directory scanning stuff */'
          t=t.replace(marker,'#ifndef __MINGW32__\\nvoid gettimeofday(struct timeval *tv, struct timezone *tz);\\n#endif\\nvoid kill_timer();\\n\\n/* directory scanning stuff */')
          a=t.find('typedef struct dirent', t.find('/* directory scanning stuff */'))
          b=t.find('/* --------------- Stuff for Win32 services', a)
          if a >= 0 and b >= 0:
              legacy=t[a:b]
              repl='#ifdef __MINGW32__\\n#include <dirent.h>\\n#else\\n'+legacy+'#endif\\n\\n'
              t=t[:a]+repl+t[b:]
          p.write_text(t)

          p=root/"misc.c"
          t=p.read_text(errors="ignore")
          t=t.replace('#ifdef WIN32\\n\\n/* routines not in Windows runtime libraries */','#if defined(WIN32) && !defined(__MINGW32__)\\n\\n/* routines not in Windows runtime libraries */')
          p.write_text(t)

          p=root/"services.c"
          t=p.read_text(errors="ignore")
          t=t.replace('VOID    service_main(DWORD dwArgc, LPTSTR *lpszArgv);','static VOID service_main(DWORD dwArgc, LPTSTR *lpszArgv);')
          t=t.replace('VOID    WINAPI service_ctrl(DWORD dwCtrlCode);','static VOID WINAPI service_ctrl(DWORD dwCtrlCode);')
          t=t.replace('BOOL    ReportStatusToSCMgr(DWORD dwCurrentState,','static BOOL ReportStatusToSCMgr(DWORD dwCurrentState,')
          t=t.replace('VOID    worker_thread(VOID *notused);','static VOID worker_thread(VOID *notused);')
          t=t.replace('VOID    StopService(LPTSTR lpszMsg);','static VOID StopService(LPTSTR lpszMsg);')
          p.write_text(t)

          p=root/"sha256.c"
          t=p.read_text(errors="ignore")
          old='#if defined(__FreeBSD__)\\n#include <sys/endian.h>\\n#else\\n#include <endian.h>\\n#endif'
          new='#ifdef WIN32\\n#ifndef LITTLE_ENDIAN\\n#define LITTLE_ENDIAN 1234\\n#endif\\n#ifndef BIG_ENDIAN\\n#define BIG_ENDIAN 4321\\n#endif\\n#ifndef BYTE_ORDER\\n#define BYTE_ORDER LITTLE_ENDIAN\\n#endif\\n#else\\n'+old+'\\n#endif'
          t=t.replace(old,new)
          p.write_text(t)

          p=root/"hotboot.c"
          t=p.read_text(errors="ignore")
          t=t.replace("#include <unistd.h>","#ifndef WIN32\\n#include <unistd.h>\\n#endif")
          t=t.replace("#include <sys/wait.h>","#ifndef WIN32\\n#include <sys/wait.h>\\n#endif")
          t=t.replace('execl( EXE_FILE, "dbsaga", buf, "hotboot", buf2, buf3, (char *)NULL );','/* Windows standalone build: hotboot exec disabled; use launcher restart. */')
          p.write_text(t)

          stub='#include "mud.h"\\nDNS_DATA *first_cache = NULL;\\nDNS_DATA *last_cache = NULL;\\nvoid save_dns(void) {}\\nvoid prune_dns(void) {}\\nvoid check_dns(void) {}\\nvoid load_dns(void) {}\\nchar *in_dns_cache(char *ip) { static char blank[1] = {0}; return blank; }\\nvoid process_dns(DESCRIPTOR_DATA *d) { (void)d; }\\nvoid resolve_dns(DESCRIPTOR_DATA *d, long ip) { (void)d; (void)ip; }\\nvoid do_cache(CHAR_DATA *ch, char *argument) { (void)argument; send_to_char("DNS cache disabled in Windows local build.\\\\n\\\\r", ch); }\\n'
          (root/"dns_win_stub.c").write_text(stub)
          PY

      - name: Compile native DBSC server
        shell: msys2 {0}
        run: |
          cd dbsc-windows/game/src
          SRC=$(ls *.c | grep -v -E '^(dns|resolver|imc)\.c$')
          gcc -std=gnu99 -O2 -fcommon -DWIN32 -D_WIN32_WINNT=0x0601 \
            -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types \
            -I. -Ichat $SRC dns_win_stub.c \
            -o ../../dbsaga-server.exe \
            -lws2_32 -lwinmm -ladvapi32 -luser32 -lshell32

      - name: Compile integrated launcher
        shell: msys2 {0}
        run: |
          cd dbsc-windows
          g++ -std=c++17 -O2 -municode launcher.cpp -o DBSC.exe -mwindows -lws2_32

      - name: Assemble portable package
        shell: msys2 {0}
        run: |
          mkdir -p dist/DBSC
          cp DBSC.exe dbsaga-server.exe README.txt dist/DBSC/
          for d in area boards clans classes corpses deities gods hotboot houses log planets player races space system; do
            if [ -d game/$d ]; then cp -a game/$d dist/DBSC/; fi
          done
          cp -a game/*.README game/*LICENSE* game/COPYRIGHT* dist/DBSC/ 2>/dev/null || true

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DBSC-Windows-x64
          path: dbsc-windows/dist/DBSC
