plugins { id 'com.android.application' }

android {
    namespace 'com.skyfire.dbsc'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.skyfire.dbsc'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-test'
        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}
